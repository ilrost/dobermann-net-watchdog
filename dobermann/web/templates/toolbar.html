<style>
.tb{ display:flex; align-items:center; gap:4px; margin-left:auto; }
.tb > form{ margin:0; }
.tb > a, .tb summary, .tb > form > button{ margin:0; padding:0; font:inherit; display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px;
  border-radius:8px; border:1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
  cursor:pointer; list-style:none; box-sizing:border-box; text-decoration:none; }
.tb summary::-webkit-details-marker{ display:none; }
.tb > form > button:hover{ opacity:1; }
.tb > a:hover, .tb summary:hover, .tb > form > button:hover, .tb details[open] summary{ color: var(--text-primary); border-color: var(--text-muted); }
.tb svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.tb details{ position:relative; }
.tb .menu{ position:absolute; right:0; top:40px; z-index:50; min-width:210px; padding:6px; border-radius:10px;
  background: var(--surface-1); border:1px solid var(--border); box-shadow: 0 6px 24px rgba(0,0,0,.14); }
.tb .menu form{ margin:0; }
.tb .menu button, .tb .menu a{ display:block; width:100%; margin:0; padding:8px 10px; border:0; border-radius:6px;
  background:none; color: var(--text-primary); font: inherit; font-size:13px; font-weight:400; text-align:left;
  text-decoration:none; cursor:pointer; box-sizing:border-box; }
.tb .menu button:hover, .tb .menu a:hover{ background: var(--surface-2); opacity:1; }
.tb .menu .current{ font-weight:600; }
.tb .menu .current::after{ content:" ✓"; color: var(--s1); }
.tb > a.upd{ width:auto; padding:0 10px; font-size:12px; font-weight:600; color:#fff; background: var(--s3); border-color: var(--s3); }
.tb .menu .info{ padding:6px 10px 8px; font-size:11.5px; color: var(--text-muted); border-bottom:1px solid var(--border); margin-bottom:4px; }
</style>

<script>
// one menu open at a time, and a click elsewhere closes it
document.addEventListener('click', function(e){
  document.querySelectorAll('.tb details[open]').forEach(function(d){ if (!d.contains(e.target)) d.removeAttribute('open'); });
});
document.querySelectorAll('.tb details').forEach(function(d){
  d.addEventListener('toggle', function(){
    if (d.open) document.querySelectorAll('.tb details[open]').forEach(function(o){ if (o !== d) o.removeAttribute('open'); });
  });
});
</script>
